version: "3"

services:
  hexplorer:
    image: ghcr.io/hareeshbabu82ns/hexplorer:main
    container_name: hexplorer
    # don't set `user:` - the entrypoint starts as root, fixes ownership of the
    # mounted folders, then drops to PUID:PGID (match the owner of your host files)
    environment:
      PUID: "1026"
      PGID: "100"
      #APP_URL: 'http://192.168.86.10:32010'
      APP_URL: "http://hexplorer.local"
      APP_SECRET: "3333xxx3333"
      BETTER_AUTH_URL: "https://hexplorer.example.com"
      BETTER_AUTH_SECRET: "change-me-openssl-rand-hex-32"
      AUTH_INTERNAL_URL: "http://127.0.0.1:3000"
      DATABASE_URL: "mongodb://user:password@mongo:27017/hexplorer?authSource=hexplorer"
      DATA_FOLDER: "/app/data"
      MOUNTS_FOLDER: "/app/data/mounts"
      # DB Management backups; must be on a persistent volume writable by the app user
      DB_BACKUP_DIR: "/app/db-backups"
      # encrypts saved DB connection strings (defaults to BETTER_AUTH_SECRET)
      # DB_ADMIN_SECRET: "change-me-openssl-rand-hex-32"
    # needed only for SSH remote mounts (sshfs)
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "43001:3000"
    restart: unless-stopped
    volumes:
      - data:/app/data
      - db-backups:/app/db-backups
      # ssh keys / config used for remotes
      - ~/.ssh:/home/nextjs/.ssh:ro

volumes:
  db-backups:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /volume1/books/Edu
